set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'rose-pine/tmux'

set -g @rose_pine_variant 'main'

set -g @rose_pine_host 'on' # Enables hostname in the status bar
set -g @rose_pine_date_time '' # Options: '%Y-%m-%d %H:%M'
set -g @rose_pine_user 'on' # Turn on the username component in the status bar
set -g @rose_pine_bar_bg_disable 'on' 
# If you're using the default statusbar, enables padding
set -g @rose_pine_default_status_bar_background 'on'

set -g mouse on
setw -g mode-keys vi

# Copy mode
bind -T copy-mode-vi v send -X begin-selection
bind P paste-buffer

# OS-specific clipboard
if-shell "uname | grep -q Darwin" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'pbcopy'; \
   bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'" \
  "bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'; \
   bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'"

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind a send-prefix

# split panes using | and -
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Set window and pane indexes to start at 1
set -g base-index 1
setw -g pane-base-index 1

run '~/.tmux/plugins/tpm/tpm'
